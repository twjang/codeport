<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Codeport architecture</title>
  <desc id="description">Codeport sets environment variables and launches the coding agent as a child process alongside a local proxy gateway. It can also start and manage an optional SSH tunnel or upstream proxy. API requests flow from the agent through the gateway to a local or remote model, either directly or through that managed connection.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="30" y="30" width="905" height="300" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="55" y="69" text-anchor="start" font-size="27" font-weight="700" fill="#3730a3">codeport</text>
    <text x="55" y="99" text-anchor="start" font-size="17" fill="#4338ca">Sets environment variables · Launches the agent · Manages gateway and connections</text>
    <rect x="55" y="145" width="225" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="167" y="185" font-size="21" font-weight="600" fill="#334155">Coding agent</text>
    <text x="167" y="215" font-size="17" fill="#475569">Child process</text>
    <path d="M280 195 H341" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="315" y="177" font-size="14" fill="#475569">API calls</text>
    <rect x="350" y="145" width="245" height="100" rx="12" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="472" y="185" font-size="21" font-weight="600" fill="#3730a3">Local proxy gateway</text>
    <text x="472" y="215" font-size="17" fill="#4338ca">Translates APIs</text>
    <path d="M595 195 H641" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="650" y="135" width="260" height="120" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-dasharray="6 4"/>
    <text x="780" y="163" font-size="15" fill="#475569">Optional · started by Codeport</text>
    <text x="780" y="195" font-size="21" font-weight="600" fill="#3730a3">SSH tunnel / proxy</text>
    <text x="780" y="225" font-size="17" fill="#4338ca">Configured access command</text>
    <path d="M910 195 H966" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="975" y="145" width="195" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1072" y="191" font-size="21" font-weight="600" fill="#334155">Model backend</text>
    <text x="1072" y="223" font-size="17" fill="#475569">Local or remote</text>
    <path d="M472 245 V300 H1072 V273" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="780" y="289" font-size="16" fill="#475569">Or connect directly</text>
  </g>
</svg>
