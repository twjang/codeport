<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title description">
  <title id="title">Your coding agent. Your model. Your connection.</title>
  <desc id="description">Codeport launches your coding agent and translates APIs to connect it to a local or remote model backend, directly or through an optional SSH tunnel or proxy.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="280" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="500" y="57" font-size="30" font-weight="700" fill="#0f172a">Your coding agent. Your model. Your connection.</text>
    <rect x="30" y="135" width="210" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="135" y="195" font-size="21" font-weight="600" fill="#334155">Your coding agent</text>
    <path d="M240 187 H291" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="135" width="270" height="104" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="435" y="177" font-size="27" font-weight="700" fill="#3730a3">codeport</text>
    <text x="435" y="210" font-size="18" fill="#4338ca">Launch · Translate APIs</text>
    <path d="M570 187 H771" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="675" y="153" font-size="16" fill="#475569">Direct, SSH tunnel,</text>
    <text x="675" y="174" font-size="16" fill="#475569">or proxy</text>
    <rect x="780" y="135" width="190" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="875" y="179" font-size="20" font-weight="600" fill="#334155">Your model</text>
    <text x="875" y="210" font-size="18" fill="#475569">Local or remote</text>
  </g>
</svg>
