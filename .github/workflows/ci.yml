name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: python3 scripts/smoke_tui.py
      - run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: Rust 1.86 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Verify unlocked installation on MSRV
        run: cargo install --path . --root "${{ runner.temp }}/launchcoder-install"

  artifacts:
    name: Build ${{ matrix.target }}
    needs: [check, msrv]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux static binary
        if: runner.os == 'Linux'
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
          force-use-cross: true
      - name: Install native macOS toolchain
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache native macOS build
        if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@v2
      - name: Build native macOS binary
        if: runner.os == 'macOS'
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package binary
        shell: bash
        run: tar -czf "launchcoder-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" launchcoder
      - uses: actions/upload-artifact@v4
        with:
          name: launchcoder-${{ matrix.target }}
          path: launchcoder-${{ matrix.target }}.tar.gz
          if-no-files-found: error
