[package]
name = "codeport"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Launch coding agents against your own model backends"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
# Transitive via reqwest/ICU: 0.8.3 uses str::from_utf8, unavailable on Rust 1.86.
# Keep unlocked installs compatible with our MSRV.
yoke-derive = "=0.8.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
